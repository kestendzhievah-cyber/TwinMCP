name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "scripts/smoke-seo.sh"
      - ".github/workflows/deploy.yml"
      - "Dockerfile"
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (omit to deploy current main). Use to roll back."
        required: false
        type: string

# Never cancel a run mid-flight: killing the SSH deploy step leaves the VPS in
# a half-deployed state. Queued runs wait for the in-flight one to finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/twinmcp-backend
  # Set the repository variable BASE_URL (Settings → Secrets and variables →
  # Actions → Variables) to your production domain. Used by the smoke test.
  BASE_URL: ${{ vars.BASE_URL || 'https://twinmcp.fr' }}

jobs:
  # Fail the WHOLE pipeline at the very first step if the DB migration secret is
  # missing — before we build or deploy anything. `migrate` now runs BEFORE
  # `deploy` (schema first, then code), but a missing secret should still stop
  # everything up front rather than at a late job. To unblock: add
  # DATABASE_URL_UNPOOLED in Settings → Secrets and variables → Actions → Secrets.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the DB migration secret
        run: |
          if [ -z "${DATABASE_URL_UNPOOLED}" ]; then
            echo "::error::DATABASE_URL_UNPOOLED secret is not set — refusing to build/deploy because migrations could not run afterwards. Add it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "DB migration secret present ✓"
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @twinmcp/backend test
      - run: pnpm --filter @twinmcp/ingest test

  build:
    needs: [test, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ inputs.sha == '' }}

      - name: Build & push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs AFTER migrate: the schema is always at least as new as the code it
  # serves. The old code tolerates the new schema as long as migrations stay
  # expand/contract (additive first; drop columns only once no deployed code
  # reads them — one deploy later).
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.sha && format('sha-{0}', inputs.sha) || 'latest' }}
          ROLLBACK_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:previous
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_TAG,ROLLBACK_TAG
          script: |
            set -euo pipefail
            cd /opt/twinmcp

            # Snapshot the currently-running image as "previous" so the
            # rollback job can restore it if the smoke test fails.
            CURRENT_ID=$(docker compose images app --format json 2>/dev/null \
              | sed -n 's/.*"ID":"\([^"]*\)".*/\1/p' \
              | head -1 || true)
            if [ -n "$CURRENT_ID" ]; then
              docker tag "$CURRENT_ID" "$ROLLBACK_TAG"
              echo "Snapshotted current image as $ROLLBACK_TAG"
            else
              echo "No running container found — first deploy, skipping snapshot"
            fi

            # IMAGE_TAG is "latest" for normal main pushes, "sha-<full>" for
            # manual workflow_dispatch.
            echo "Deploying tag: $IMAGE_TAG"
            docker compose pull app
            docker compose up -d --no-deps app

            # Cleanup dangling images older than 7 days.
            docker image prune -f --filter "until=168h" || true

  # Schema before code (expand/contract): if the migration fails, nothing is
  # deployed and prod keeps running old code on the old schema — no incident.
  # The old "deploy then migrate" order served new code on an old schema for
  # 1–3 minutes on every schema change (marketplace 500 on a missing column).
  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Guard — require the DB secret
        # Fail LOUD if the secret is missing. Without it db:migrate exits 1
        # silently and the app boots against an old schema (this exact gap left
        # prod stuck at an old migration once).
        run: |
          if [ -z "${DATABASE_URL_UNPOOLED}" ]; then
            echo "::error::DATABASE_URL_UNPOOLED secret is not set — migrations cannot run. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Apply migrations
        run: pnpm --filter @twinmcp/backend db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Seed official MCP catalog (idempotent)
        # Ensures the marketplace + auto-installed twinmcp-docs are never empty on
        # a fresh/updated DB. Idempotent (onConflictDoUpdate in seed-mcps.ts).
        run: pnpm --filter @twinmcp/backend seed:mcps
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wait for warm-up
        run: sleep 30
      - name: Run SEO smoke test
        run: bash scripts/smoke-seo.sh "$BASE_URL"

  rollback:
    # Auto-rollback only on normal pushes — manual workflow_dispatch with a
    # `sha` input is explicit recovery; we don't want to undo that.
    # `deploy.result != 'skipped'` matters: if migrate fails, deploy never ran,
    # the old image is still live, and "rolling back" would needlessly downgrade
    # prod to an even older snapshot.
    needs: [deploy, migrate, smoke]
    if: failure() && inputs.sha == '' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: SSH rollback to previous image
        uses: appleboy/ssh-action@v1.2.0
        env:
          ROLLBACK_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:previous
          LATEST_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: ROLLBACK_TAG,LATEST_TAG
          script: |
            set -euo pipefail
            cd /opt/twinmcp

            # Refuse to roll back if no previous image was snapshotted
            # (first deploy, manual deploy, or VPS image cache pruned).
            if ! docker image inspect "$ROLLBACK_TAG" >/dev/null 2>&1; then
              echo "❌ No previous image available to roll back to — manual recovery needed"
              exit 1
            fi

            # Re-point :latest at the snapshotted previous image and recreate.
            docker tag "$ROLLBACK_TAG" "$LATEST_TAG"
            docker compose up -d --no-deps --force-recreate app
            echo "✅ Rolled back to previous image ($ROLLBACK_TAG)"

      - name: Verify rollback with smoke test
        run: |
          sleep 20
          bash scripts/smoke-seo.sh "$BASE_URL"
        # If post-rollback smoke also fails, the whole workflow stays red and
        # the on-call engineer must intervene.
