[project]
name = "revit-mcp"
version = "0.1.0"
description = "MCP server that connects Claude to a Revit BIM model (demo + live modes)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
revit-mcp = "revit_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revit_mcp"]
